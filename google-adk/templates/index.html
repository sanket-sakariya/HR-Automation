<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Interviewer | Junior Python Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Load DOM Manager -->
    <script src="/static/dom_manager.js"></script>
    
    <style>
        /* ============================================
           CSS Variables & Reset
           ============================================ */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #050505;
            --bg-tertiary: #0a0a0a;
            --bg-glass: rgba(10, 10, 10, 0.85);
            --bg-glass-light: rgba(20, 20, 20, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #606060;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.12);
            --accent: #ffffff;
            --accent-dim: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --live-red: #ff3b30;
            --glass-blur: 20px;
            --gate-closed: #404040;
            --gate-open: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           Layout
           ============================================ */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            grid-template-rows: 72px 1fr 88px;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: var(--bg-primary);
        }

        /* ============================================
           Header
           ============================================ */
        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border: 1.5px solid var(--text-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.5px;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Status Indicators Container */
        .status-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Performance Status Bar */
        .perf-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }

        .perf-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        .perf-item .label {
            color: var(--text-muted);
        }

        .perf-item .value {
            color: var(--text-secondary);
            min-width: 45px;
        }

        .perf-item.good .value {
            color: var(--success);
        }

        .perf-item.warning .value {
            color: var(--warning);
        }

        .perf-item.bad .value {
            color: var(--error);
        }

        /* Status Badge with Live Indicator */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--bg-glass-light);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.2s ease;
        }

        .status-dot.ready {
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
        }

        .status-dot.speaking {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse-glow 1.2s ease-in-out infinite;
        }

        .status-dot.listening {
            background: var(--warning);
            box-shadow: 0 0 12px var(--warning);
        }

        .status-dot.error {
            background: var(--error);
            box-shadow: 0 0 12px var(--error);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* ============================================
           Main Content - Visualizer
           ============================================ */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 70%);
        }

        .visualizer-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visualizer-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
        }

        .visualizer-ring:nth-child(1) { width: 100%; height: 100%; }
        .visualizer-ring:nth-child(2) { width: 78%; height: 78%; }
        .visualizer-ring:nth-child(3) { width: 56%; height: 56%; }
        .visualizer-ring:nth-child(4) { width: 34%; height: 34%; }

        .visualizer-ring.active {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .audio-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Noise Gate Indicator */
        .gate-indicator {
            position: absolute;
            bottom: -40px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.15s ease;
        }

        .gate-indicator .gate-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gate-closed);
            transition: all 0.15s ease;
        }

        .gate-indicator.open .gate-dot {
            background: var(--gate-open);
            box-shadow: 0 0 10px var(--gate-open);
        }

        .gate-indicator .gate-label {
            color: var(--text-muted);
        }

        .gate-indicator.open .gate-label {
            color: var(--text-primary);
        }

        .gate-indicator .db-level {
            color: var(--text-muted);
            min-width: 50px;
            text-align: right;
        }

        .visualizer-core {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--bg-tertiary), var(--bg-primary));
            border: 1.5px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 10;
        }

        .visualizer-core.active {
            border-color: var(--accent);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
        }

        .visualizer-core svg {
            width: 32px;
            height: 32px;
            fill: var(--text-muted);
            transition: fill 0.2s ease;
        }

        .visualizer-core.active svg {
            fill: var(--text-primary);
        }

        .interview-info {
            position: absolute;
            bottom: 32px;
            text-align: center;
        }

        .interview-info h2 {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 6px;
        }

        .interview-info p {
            font-size: 28px;
            font-weight: 200;
            letter-spacing: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ============================================
           Transcript Panel - Glassmorphism
           ============================================ */
        .transcript-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            border-left: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 0;
        }

        .panel-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-glass-light);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title h3 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Entry count badge */
        .entry-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 2px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
        }

        /* Live Recording Indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: var(--live-red);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
            transition: opacity 0.3s ease;
        }

        .live-indicator.active {
            opacity: 1;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--live-red);
            animation: live-pulse 1s ease-in-out infinite;
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .panel-header button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .panel-header button:hover {
            color: var(--text-primary);
            background: var(--accent-dim);
        }

        /* Transcript Content - Fixed Height with Scroll */
        .transcript-content {
            flex: 1 1 0;
            min-height: 0;
            max-height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Fade out effect for old messages */
        .transcript-message.fading-out {
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        /* Custom Scrollbar */
        .transcript-content::-webkit-scrollbar {
            width: 5px;
        }

        .transcript-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .transcript-content::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 3px;
        }

        .transcript-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Transcript Messages - Glassmorphism Cards */
        .transcript-message {
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--bg-glass-light);
            border: 1px solid var(--border-color);
            animation: message-in 0.25s ease-out;
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transcript-message.interviewer {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .transcript-message.candidate {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.15);
        }

        .transcript-message .role {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
        }

        .transcript-message.interviewer .role {
            color: var(--text-secondary);
        }

        .transcript-message.candidate .role {
            color: var(--success);
        }

        .transcript-message .text {
            font-size: 13px;
            line-height: 1.65;
            color: var(--text-primary);
        }

        .transcript-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .transcript-placeholder svg {
            width: 40px;
            height: 40px;
            margin-bottom: 14px;
            opacity: 0.3;
        }

        .transcript-placeholder p {
            font-size: 13px;
        }

        /* ============================================
           Controls Footer
           ============================================ */
        .controls-footer {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur));
            border-top: 1px solid var(--border-color);
        }

        /* Mic Indicator */
        .mic-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .mic-indicator.active {
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
        }

        .mic-indicator svg {
            width: 14px;
            height: 14px;
        }

        .mic-level {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 14px;
        }

        .mic-bar {
            width: 3px;
            background: currentColor;
            border-radius: 2px;
            transition: height 0.05s ease;
        }

        /* Control Buttons */
        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .control-btn:hover:not(:disabled) {
            background: var(--bg-glass-light);
            border-color: var(--border-light);
            transform: translateY(-1px);
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .control-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
        }

        .control-btn.primary {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .control-btn.primary:hover:not(:disabled) {
            background: var(--text-secondary);
            border-color: var(--text-secondary);
        }

        .control-btn.danger {
            border-color: rgba(239, 68, 68, 0.5);
            color: var(--error);
        }

        .control-btn.danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
        }

        /* ============================================
           Toast
           ============================================ */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-glass-light);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.4);
        }

        .toast svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .toast.error svg {
            fill: var(--error);
        }

        .toast span {
            font-size: 13px;
        }

        /* ============================================
           Responsive
           ============================================ */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: 64px 1fr minmax(200px, 280px) 80px;
            }

            .transcript-panel {
                border-left: none;
                border-top: 1px solid var(--border-color);
                max-height: 280px;
            }

            .header, .controls-footer {
                padding: 0 20px;
            }

            .visualizer-container {
                width: 240px;
                height: 240px;
            }

            .visualizer-core {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">AI</div>
                <div class="logo-text">
                    <h1>Live Interviewer</h1>
                    <span>Junior Python Developer Position</span>
                </div>
            </div>
            <div class="status-container">
                <!-- Performance Status Bar -->
                <div class="perf-status" id="perfStatus">
                    <div class="perf-item" id="latencyItem">
                        <span class="label">Latency:</span>
                        <span class="value" id="latencyValue">--ms</span>
                    </div>
                    <div class="perf-item" id="memoryItem">
                        <span class="label">Memory:</span>
                        <span class="value" id="memoryValue">Stable</span>
                    </div>
                    <div class="perf-item" id="workerItem">
                        <span class="label">Worker:</span>
                        <span class="value" id="workerValue">--</span>
                    </div>
                </div>
                <div class="status-badge">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Initializing...</span>
                </div>
            </div>
        </header>

        <!-- Main Visualizer -->
        <main class="main-content">
            <div class="visualizer-container">
                <div class="visualizer-ring" id="ring1"></div>
                <div class="visualizer-ring" id="ring2"></div>
                <div class="visualizer-ring" id="ring3"></div>
                <div class="visualizer-ring" id="ring4"></div>
                <canvas class="audio-canvas" id="audioCanvas" width="400" height="400"></canvas>
                <div class="visualizer-core" id="visualizerCore">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>
                <!-- Noise Gate Indicator -->
                <div class="gate-indicator" id="gateIndicator">
                    <div class="gate-dot"></div>
                    <span class="gate-label">Gate</span>
                    <span class="db-level" id="dbLevel">--dB</span>
                </div>
            </div>
            <div class="interview-info">
                <h2>Technical Interview</h2>
                <p id="interviewTime">00:00</p>
            </div>
        </main>

        <!-- Transcript Panel -->
        <aside class="transcript-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <h3>Live Transcript</h3>
                    <span class="entry-count" id="entryCount">0/50</span>
                    <div class="live-indicator" id="liveIndicator">
                        <div class="live-dot"></div>
                        <span>Live</span>
                    </div>
                </div>
                <button id="clearTranscript" title="Clear transcript">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                    </svg>
                </button>
            </div>
            <div class="transcript-content" id="transcriptContent">
                <div class="transcript-placeholder" id="transcriptPlaceholder">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    </svg>
                    <p>Start the interview to see the live transcript</p>
                </div>
            </div>
        </aside>

        <!-- Controls -->
        <footer class="controls-footer">
            <div class="mic-indicator" id="micIndicator">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <div class="mic-level">
                    <div class="mic-bar" style="height: 4px;"></div>
                    <div class="mic-bar" style="height: 6px;"></div>
                    <div class="mic-bar" style="height: 5px;"></div>
                    <div class="mic-bar" style="height: 8px;"></div>
                    <div class="mic-bar" style="height: 4px;"></div>
                </div>
                <span>Mic</span>
            </div>
            
            <button class="control-btn primary" id="startBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                Start Interview
            </button>
            
            <button class="control-btn danger" id="endBtn" disabled>
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h12v12H6z"/>
                </svg>
                End Session
            </button>
        </footer>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="toastMessage">Error message</span>
    </div>

    <script>
        /**
         * ============================================
         * Live AI Interviewer - Production Hardened
         * Features:
         * - Web Worker for PCM processing (60fps UI)
         * - Volume Gate to filter noise
         * - Capped transcript list (memory management)
         * - Explicit AudioBufferSourceNode cleanup
         * - Consistent 50ms send intervals
         * - Latency and memory monitoring
         * ============================================
         */
        
        class LiveInterviewer {
            constructor() {
                // WebSocket
                this.ws = null;
                this.wsUrl = `ws://${window.location.host}/ws/interview`;
                
                // Audio Capture
                this.captureContext = null;
                this.mediaStream = null;
                this.analyser = null;
                this.sourceNode = null;
                this.processorNode = null;
                
                // Web Worker for PCM processing
                this.audioWorker = null;
                this.workerReady = false;
                
                // Low-Latency Audio Playback with explicit cleanup
                this.playbackContext = null;
                this.scheduledTime = 0;
                this.activeSources = new Set(); // Track all active sources for cleanup
                
                // Audio state
                this.isGateOpen = false;
                this.currentDbLevel = -Infinity;
                
                // Client-side VAD
                this.isSpeaking = false;
                this.silenceStart = 0;
                this.isAISpeaking = false;
                
                // State
                this.isActive = false;
                this.startTime = null;
                this.timerInterval = null;
                
                // Performance tracking
                this.latencyMs = 0;
                this.sendInterval = 20; // Reduced from 50ms for lower latency
                this.lastSendTime = 0;
                
                // DOM Manager for memory-efficient transcript
                this.domManager = new DOMManager({
                    maxTranscriptEntries: 50,
                    onCleanup: (info) => this.updateEntryCount()
                });
                
                // Transcript state
                this.interviewerText = '';
                this.candidateText = '';
                this.interviewerEl = null;
                this.candidateEl = null;
                
                // DOM Elements
                this.el = {
                    startBtn: document.getElementById('startBtn'),
                    endBtn: document.getElementById('endBtn'),
                    statusDot: document.getElementById('statusDot'),
                    statusText: document.getElementById('statusText'),
                    transcript: document.getElementById('transcriptContent'),
                    placeholder: document.getElementById('transcriptPlaceholder'),
                    clearBtn: document.getElementById('clearTranscript'),
                    core: document.getElementById('visualizerCore'),
                    canvas: document.getElementById('audioCanvas'),
                    time: document.getElementById('interviewTime'),
                    mic: document.getElementById('micIndicator'),
                    live: document.getElementById('liveIndicator'),
                    toast: document.getElementById('toast'),
                    toastMsg: document.getElementById('toastMessage'),
                    rings: [
                        document.getElementById('ring1'),
                        document.getElementById('ring2'),
                        document.getElementById('ring3'),
                        document.getElementById('ring4')
                    ],
                    // New performance elements
                    gateIndicator: document.getElementById('gateIndicator'),
                    dbLevel: document.getElementById('dbLevel'),
                    latencyValue: document.getElementById('latencyValue'),
                    latencyItem: document.getElementById('latencyItem'),
                    memoryValue: document.getElementById('memoryValue'),
                    memoryItem: document.getElementById('memoryItem'),
                    workerValue: document.getElementById('workerValue'),
                    workerItem: document.getElementById('workerItem'),
                    entryCount: document.getElementById('entryCount')
                };
                
                this.canvasCtx = this.el.canvas.getContext('2d');
                this.vizData = new Uint8Array(128);
                
                // Set transcript container for DOM manager
                this.domManager.setContainer(this.el.transcript);
                
                this.init();
            }
            
            init() {
                this.el.startBtn.onclick = () => this.start();
                this.el.endBtn.onclick = () => this.stop();
                this.el.clearBtn.onclick = () => this.clearTranscript();
                this.setStatus('disconnected', 'Click Start to begin');
                this.updateEntryCount();
                
                // Initialize Web Worker
                this.initAudioWorker();
            }
            
            // ==================
            // Web Worker
            // ==================
            
            initAudioWorker() {
                try {
                    this.audioWorker = new Worker('/static/audio_worker.js');
                    
                    this.audioWorker.onmessage = (e) => {
                        const { type, pcmBuffer, metrics } = e.data;
                        
                        if (type === 'ready') {
                            this.workerReady = true;
                            this.el.workerValue.textContent = 'Ready';
                            this.el.workerItem.classList.add('good');
                            console.log('✅ Audio Worker ready');
                        } else if (type === 'processed_audio') {
                            this.handleProcessedAudio(pcmBuffer, metrics);
                        }
                    };
                    
                    this.audioWorker.onerror = (e) => {
                        console.error('Worker error:', e);
                        this.workerReady = false;
                        this.el.workerValue.textContent = 'Error';
                        this.el.workerItem.classList.remove('good');
                        this.el.workerItem.classList.add('bad');
                    };
                    
                } catch (err) {
                    console.warn('Web Worker not available, using main thread:', err);
                    this.workerReady = false;
                    this.el.workerValue.textContent = 'N/A';
                }
            }
            
            handleProcessedAudio(pcmBuffer, metrics) {
                // Update UI with audio level (for visualization only)
                this.currentDbLevel = metrics.dbLevel;
                this.updateGateIndicator();
                
                // Don't send audio while AI is speaking (prevents speaker feedback)
                if (this.isAISpeaking) {
                    // Allow barge-in with loud voice to interrupt AI
                    const bargeInThreshold = -20; // dB for barge-in
                    if (metrics.dbLevel > bargeInThreshold) {
                        this.stopAudio();
                        this.send({ type: 'interrupt' });
                        this.sendBinary(pcmBuffer);
                    }
                    return;
                }
                
                // Send ALL audio to Gemini - let its built-in VAD handle speech detection
                this.sendBinary(pcmBuffer);
            }
            
            updateGateIndicator() {
                // Show audio level only (gate removed - Gemini handles VAD)
                const isActive = !this.isAISpeaking && this.currentDbLevel > -50;
                if (isActive) {
                    this.el.gateIndicator.classList.add('open');
                } else {
                    this.el.gateIndicator.classList.remove('open');
                }
                
                // Update dB display
                const dbDisplay = isFinite(this.currentDbLevel) 
                    ? `${Math.round(this.currentDbLevel)}dB` 
                    : '--dB';
                this.el.dbLevel.textContent = dbDisplay;
            }
            
            // ==================
            // WebSocket
            // ==================
            
            async connect() {
                return new Promise((resolve, reject) => {
                    this.ws = new WebSocket(this.wsUrl);
                    this.ws.binaryType = 'arraybuffer'; // Critical: Use arraybuffer for binary
                    
                    this.ws.onopen = () => {
                        console.log('✅ WebSocket connected');
                        resolve();
                    };
                    
                    this.ws.onclose = () => {
                        console.log('📴 WebSocket closed');
                        this.handleDisconnect();
                    };
                    
                    this.ws.onerror = (e) => {
                        console.error('WebSocket error:', e);
                        reject(e);
                    };
                    
                    this.ws.onmessage = (e) => this.handleMessage(e);
                });
            }
            
            handleMessage(event) {
                // Binary audio data - play immediately
                if (event.data instanceof ArrayBuffer) {
                    this.playAudioChunk(event.data);
                    return;
                }
                
                // JSON messages
                try {
                    const msg = JSON.parse(event.data);
                    
                    switch (msg.type) {
                        case 'status':
                            this.handleStatus(msg.status, msg.latency_ms);
                            break;
                        case 'transcript':
                            this.handleTranscript(msg.role, msg.text);
                            break;
                        case 'interrupt':
                            this.stopAudio();
                            break;
                        case 'error':
                            this.showToast(msg.message, 'error');
                            break;
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            }
            
            handleStatus(status, latencyMs) {
                // Update latency display
                if (latencyMs !== undefined) {
                    this.latencyMs = latencyMs;
                    this.el.latencyValue.textContent = `${Math.round(latencyMs)}ms`;
                    
                    // Color code latency
                    this.el.latencyItem.classList.remove('good', 'warning', 'bad');
                    if (latencyMs < 200) {
                        this.el.latencyItem.classList.add('good');
                    } else if (latencyMs < 500) {
                        this.el.latencyItem.classList.add('warning');
                    } else {
                        this.el.latencyItem.classList.add('bad');
                    }
                }
                
                switch (status) {
                    case 'ready':
                        this.setStatus('ready', 'Ready');
                        break;
                    case 'speaking':
                        this.isAISpeaking = true;
                        this.setStatus('speaking', 'AI Speaking...');
                        this.el.core.classList.add('active');
                        this.el.rings.forEach(r => r.classList.add('active'));
                        break;
                    case 'listening':
                        this.isAISpeaking = false;
                        this.setStatus('listening', 'Listening...');
                        this.el.core.classList.remove('active');
                        this.el.rings.forEach(r => r.classList.remove('active'));
                        break;
                }
            }
            
            handleDisconnect() {
                this.isActive = false;
                this.setStatus('disconnected', 'Disconnected');
                this.el.startBtn.disabled = false;
                this.el.endBtn.disabled = true;
                this.el.live.classList.remove('active');
                this.stopTimer();
                this.stopCapture();
            }
            
            send(data) {
                if (this.ws?.readyState === WebSocket.OPEN) {
                    this.ws.send(typeof data === 'string' ? data : JSON.stringify(data));
                }
            }
            
            sendBinary(buffer) {
                if (this.ws?.readyState === WebSocket.OPEN) {
                    this.ws.send(buffer);
                }
            }
            
            // ==================
            // Audio Capture (Web Worker Pipeline)
            // ==================
            
            async initCapture() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });
                    
                    // Create capture context at 16kHz
                    this.captureContext = new AudioContext({ sampleRate: 16000 });
                    this.sourceNode = this.captureContext.createMediaStreamSource(this.mediaStream);
                    
                    // Analyser for visualization
                    this.analyser = this.captureContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.sourceNode.connect(this.analyser);
                    
                    // ScriptProcessor to feed Web Worker (smaller buffer = lower latency)
                    this.processorNode = this.captureContext.createScriptProcessor(1024, 1, 1);
                    
                    this.processorNode.onaudioprocess = (e) => {
                        if (!this.isActive) return;
                        
                        const input = e.inputBuffer.getChannelData(0);
                        
                        if (this.workerReady && this.audioWorker) {
                            // Send to Web Worker for processing (off main thread)
                            this.audioWorker.postMessage({
                                type: 'audio_data',
                                data: input.buffer.slice(0), // Clone buffer
                                timestamp: performance.now()
                            });
                        } else {
                            // Fallback: process on main thread
                            this.processAudioMainThread(input);
                        }
                    };
                    
                    this.sourceNode.connect(this.processorNode);
                    this.processorNode.connect(this.captureContext.destination);
                    
                    // Start visualization
                    this.startVisualization();
                    
                    this.el.mic.classList.add('active');
                    this.el.live.classList.add('active');
                    
                    console.log('✅ Audio capture initialized with Web Worker');
                    return true;
                    
                } catch (err) {
                    console.error('Mic error:', err);
                    this.showToast('Microphone access denied', 'error');
                    return false;
                }
            }
            
            // Fallback main thread processing if Worker unavailable
            processAudioMainThread(input) {
                const pcm = new Int16Array(input.length);
                let energy = 0;
                
                for (let i = 0; i < input.length; i++) {
                    const s = Math.max(-1, Math.min(1, input[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    energy += input[i] * input[i];
                }
                
                const rms = Math.sqrt(energy / input.length);
                const dbLevel = rms > 0 ? 20 * Math.log10(rms) : -Infinity;
                
                this.handleProcessedAudio(pcm.buffer, {
                    dbLevel: dbLevel,
                    rms: rms
                });
            }
            
            stopCapture() {
                // Cleanup media stream
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(t => t.stop());
                    this.mediaStream = null;
                }
                
                // Cleanup audio nodes
                if (this.processorNode) {
                    this.processorNode.disconnect();
                    this.processorNode.onaudioprocess = null;
                    this.processorNode = null;
                }
                
                if (this.sourceNode) {
                    this.sourceNode.disconnect();
                    this.sourceNode = null;
                }
                
                if (this.analyser) {
                    this.analyser.disconnect();
                    this.analyser = null;
                }
                
                if (this.captureContext) {
                    this.captureContext.close();
                    this.captureContext = null;
                }
                
                // Reset worker
                if (this.audioWorker) {
                    this.audioWorker.postMessage({ type: 'reset' });
                }
                
                this.el.mic.classList.remove('active');
                this.el.live.classList.remove('active');
            }
            
            // ==================
            // Audio Playback (Memory-Safe)
            // ==================
            
            async playAudioChunk(pcmBuffer) {
                // Ensure playback context exists at 24kHz (Gemini output rate)
                if (!this.playbackContext || this.playbackContext.state === 'closed') {
                    this.playbackContext = new AudioContext({ sampleRate: 24000 });
                    this.scheduledTime = this.playbackContext.currentTime;
                }
                
                // Resume if suspended
                if (this.playbackContext.state === 'suspended') {
                    await this.playbackContext.resume();
                }
                
                // Convert Int16 PCM to Float32
                const int16 = new Int16Array(pcmBuffer);
                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) {
                    float32[i] = int16[i] / 32768.0;
                }
                
                // Create buffer
                const buffer = this.playbackContext.createBuffer(1, float32.length, 24000);
                buffer.getChannelData(0).set(float32);
                
                // Schedule playback
                const source = this.playbackContext.createBufferSource();
                source.buffer = buffer;
                source.connect(this.playbackContext.destination);
                
                // Track source for cleanup
                this.activeSources.add(source);
                this.domManager.registerAudioSource(source);
                
                // Calculate start time for gapless playback
                const now = this.playbackContext.currentTime;
                const startTime = Math.max(now, this.scheduledTime);
                
                source.start(startTime);
                this.scheduledTime = startTime + buffer.duration;
                
                // Explicit cleanup when source ends
                source.onended = () => {
                    this.cleanupAudioSource(source);
                };
            }
            
            cleanupAudioSource(source) {
                if (!source) return;
                
                try {
                    source.disconnect();
                    source.buffer = null;
                    source.onended = null;
                } catch (e) {
                    // Already cleaned up
                }
                
                this.activeSources.delete(source);
            }
            
            stopAudio() {
                // Stop all active sources
                this.activeSources.forEach(source => {
                    try {
                        source.stop();
                    } catch (e) {}
                    this.cleanupAudioSource(source);
                });
                this.activeSources.clear();
                
                // Reset playback context
                if (this.playbackContext) {
                    this.playbackContext.close();
                    this.playbackContext = null;
                }
                
                this.scheduledTime = 0;
                this.isAISpeaking = false;
                
                console.log('🛑 Audio stopped, sources cleaned');
            }
            
            // ==================
            // Visualization (Frequency + Gate State)
            // ==================
            
            startVisualization() {
                const draw = () => {
                    if (!this.isActive) return;
                    requestAnimationFrame(draw);
                    
                    if (this.analyser) {
                        this.analyser.getByteFrequencyData(this.vizData);
                    }
                    
                    this.drawVisualizer();
                    this.updateMicLevel();
                    this.updateMemoryStatus();
                };
                draw();
            }
            
            drawVisualizer() {
                const canvas = this.el.canvas;
                const ctx = this.canvasCtx;
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                
                ctx.clearRect(0, 0, w, h);
                
                const bars = 64;
                const maxHeight = 70;
                
                for (let i = 0; i < bars; i++) {
                    const idx = Math.floor(i * this.vizData.length / bars);
                    const val = this.vizData[idx] || 0;
                    const barH = (val / 255) * maxHeight;
                    
                    const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
                    const r1 = 60;
                    const r2 = r1 + barH;
                    
                    const x1 = cx + Math.cos(angle) * r1;
                    const y1 = cy + Math.sin(angle) * r1;
                    const x2 = cx + Math.cos(angle) * r2;
                    const y2 = cy + Math.sin(angle) * r2;
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    
                    // Gray when gate closed, white when open
                    if (this.isGateOpen) {
                        ctx.strokeStyle = `rgba(255,255,255,${0.3 + (val / 255) * 0.7})`;
                    } else {
                        ctx.strokeStyle = `rgba(100,100,100,${0.2 + (val / 255) * 0.4})`;
                    }
                    
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }
            
            updateMicLevel() {
                const bars = this.el.mic.querySelectorAll('.mic-bar');
                let sum = 0;
                for (let i = 0; i < this.vizData.length; i++) sum += this.vizData[i];
                const avg = sum / this.vizData.length;
                
                bars.forEach((bar, i) => {
                    const h = 3 + (avg / 255) * 11 * (0.6 + Math.random() * 0.4);
                    bar.style.height = `${Math.min(14, h)}px`;
                });
            }
            
            updateMemoryStatus() {
                const status = this.domManager.getMemoryStatus();
                this.el.memoryValue.textContent = status.status.charAt(0).toUpperCase() + status.status.slice(1);
                
                this.el.memoryItem.classList.remove('good', 'warning', 'bad');
                if (status.status === 'stable') {
                    this.el.memoryItem.classList.add('good');
                } else if (status.status === 'warning') {
                    this.el.memoryItem.classList.add('warning');
                } else {
                    this.el.memoryItem.classList.add('bad');
                }
            }
            
            updateEntryCount() {
                const count = this.domManager.getEntryCount();
                const max = this.domManager.maxEntries;
                this.el.entryCount.textContent = `${count}/${max}`;
            }
            
            // ==================
            // Transcript (Memory-Managed)
            // ==================
            
            handleTranscript(role, text) {
                // Only handle AI/interviewer transcripts (user transcript disabled for latency)
                if (role !== 'interviewer') return;
                
                this.el.placeholder.style.display = 'none';
                
                this.interviewerText += text;
                
                if (this.interviewerEl) {
                    this.interviewerEl.querySelector('.text').textContent = this.interviewerText;
                } else {
                    this.interviewerEl = this.createMessage('AI Interviewer', this.interviewerText, 'interviewer');
                }
                
                this.autoScroll();
                this.updateEntryCount();
            }
            
            createMessage(role, text, className) {
                const div = document.createElement('div');
                div.className = `transcript-message ${className}`;
                div.innerHTML = `
                    <span class="role">${role}</span>
                    <p class="text">${text}</p>
                `;
                
                // Use DOM Manager for memory-safe insertion
                this.domManager.addEntry(div, className);
                
                return div;
            }
            
            autoScroll() {
                requestAnimationFrame(() => {
                    this.el.transcript.scrollTop = this.el.transcript.scrollHeight;
                });
            }
            
            clearTranscript() {
                this.domManager.clearAll();
                
                // Re-add placeholder
                this.el.placeholder.style.display = 'flex';
                this.el.transcript.appendChild(this.el.placeholder);
                
                this.interviewerText = '';
                this.candidateText = '';
                this.interviewerEl = null;
                this.candidateEl = null;
                this.updateEntryCount();
            }
            
            // ==================
            // Interview Control
            // ==================
            
            async start() {
                try {
                    this.el.startBtn.disabled = true;
                    this.setStatus('connecting', 'Connecting...');
                    
                    // Init audio first
                    if (!await this.initCapture()) {
                        this.el.startBtn.disabled = false;
                        this.setStatus('error', 'Mic error');
                        return;
                    }
                    
                    // Connect WebSocket
                    await this.connect();
                    
                    this.isActive = true;
                    this.el.endBtn.disabled = false;
                    
                    this.clearTranscript();
                    this.startTimer();
                    
                    // Start interview after brief delay
                    setTimeout(() => {
                        this.send({ type: 'start_interview' });
                    }, 300);
                    
                } catch (err) {
                    console.error('Start error:', err);
                    this.showToast('Failed to start. Try again.', 'error');
                    this.el.startBtn.disabled = false;
                    this.setStatus('error', 'Failed');
                }
            }
            
            stop() {
                this.isActive = false;
                this.send({ type: 'end_session' });
                
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
                
                this.stopAudio();
                this.stopCapture();
                this.stopTimer();
                
                // Cleanup DOM manager
                this.domManager.cleanupAllAudioSources();
                
                this.el.startBtn.disabled = false;
                this.el.endBtn.disabled = true;
                this.el.core.classList.remove('active');
                this.setStatus('ended', 'Interview Ended');
            }
            
            // ==================
            // Timer
            // ==================
            
            startTimer() {
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => {
                    const elapsed = Date.now() - this.startTime;
                    const m = Math.floor(elapsed / 60000);
                    const s = Math.floor((elapsed % 60000) / 1000);
                    this.el.time.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }, 1000);
            }
            
            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }
            
            // ==================
            // UI Helpers
            // ==================
            
            setStatus(state, text) {
                this.el.statusDot.className = 'status-dot ' + state;
                this.el.statusText.textContent = text;
            }
            
            showToast(msg, type = 'info') {
                this.el.toast.className = `toast ${type}`;
                this.el.toastMsg.textContent = msg;
                this.el.toast.classList.add('show');
                setTimeout(() => this.el.toast.classList.remove('show'), 4000);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new LiveInterviewer();
        });
    </script>
</body>
</html>
