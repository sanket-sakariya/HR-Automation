                          correctAnswers:
                            type: integer
                          evaluation:
                            type: object

  # ==================== NOTIFICATIONS ====================
  /api/notifications/email:
    post:
      tags:
        - Notifications
      summary: Send email notification
      description: Send custom email notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientId
                - recipientType
                - subject
                - message
              properties:
                recipientId:
                  type: string
                  format: uuid
                recipientType:
                  type: string
                  enum: [candidate, company]
                subject:
                  type: string
                message:
                  type: string
                template:
                  type: string
                  enum: [invitation, rejection, offer, reminder]
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/notifications/rejection:
    post:
      tags:
        - Notifications
      summary: Send rejection email
      description: Send rejection notification to candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
                - jobId
              properties:
                candidateId:
                  type: string
                  format: uuid
                jobId:
                  type: string
                  format: uuid
                customMessage:
                  type: string
      responses:
        '200':
          description: Rejection email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/notifications/invitation:
    post:
      tags:
        - Notifications
      summary: Send interview invitation
      description: Send interview invitation to candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
                - interviewId
              properties:
                candidateId:
                  type: string
                  format: uuid
                interviewId:
                  type: string
                  format: uuid
                customMessage:
                  type: string
      responses:
        '200':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/notifications/{userId}:
    get:
      tags:
        - Notifications
      summary: Get user notifications
      description: Retrieve notifications for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: read
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'

    put:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Mark a notification as read
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notificationIds
              properties:
                notificationIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== HEALTH CHECK ====================
  /api/health:
    get:
      summary: Health check endpoint
      description: Check API health and service status
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [up, down]
                      gemini_api:
                        type: string
                        enum: [up, down]
                      email_service:
                        type: string
                        enum: [up, down]

  # ==================== WEBHOOKS ====================
  /api/webhooks/{provider}:
    post:
      summary: Webhook endpoint for external providers
      description: Handle webhooks from external services (LinkedIn, Indeed, etc.)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [linkedin, indeed, email_service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "processed"

components:
  # ==================== SECURITY SCHEMES ====================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for external integrations

  # ==================== PARAMETERS ====================
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the company

    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the job posting

    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the candidate

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the session

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

  # ==================== RESPONSES ====================
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ==================== SCHEMAS ====================
  schemas:
    # ==================== RESPONSE SCHEMAS ====================
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred"
        error:
          type: object
          properties:
            code:
              type: string
              example: "INTERNAL_ERROR"
            details:
              type: object
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string

    AuthenticationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  example: "AUTHENTICATION_FAILED"

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrev:
              type: boolean
        timestamp:
          type: string
          format: date-time

    # ==================== BUSINESS SCHEMAS ====================
    Company:
      type: object
      required:
        - id
        - companyName
        - email
        - industry
        - size
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
        industry:
          type: string
        size:
          type: string
          enum: [1-10, 11-50, 51-200, 201-500, 501-1000, 1001+]
        website:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: string
        logo:
          type: string
          format: uri
        subscriptionPlan:
          type: string
          enum: [starter, professional, enterprise]
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zipCode:
          type: string

    JobRequirementInput:
      type: object
      required:
        - title
        - department
        - description
        - requirements
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        department:
          type: string
        description:
          type: string
          minLength: 50
        requirements:
          type: array
          items:
            type: object
            properties:
              skill:
                type: string
              level:
                type: string
                enum: [beginner, intermediate, advanced, expert]
              required:
                type: boolean
                default: true
        experience:
          type: object
          properties:
            minYears:
              type: integer
              minimum: 0
            maxYears:
              type: integer
              minimum: 0
            preferred:
              type: integer
        location:
          type: string
        jobType:
          type: string
          enum: [full-time, part-time, contract, internship]
        salaryRange:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            currency:
              type: string
              default: "USD"
        benefits:
          type: array
          items:
            type: string

    JobRequirement:
      allOf:
        - $ref: '#/components/schemas/JobRequirementInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            companyId:
              type: string
              format: uuid
            status:
              type: string
              enum: [draft, active, closed]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    JobPostingInput:
      type: object
      required:
        - title
        - description
        - requirements
        - companyId
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          minLength: 50
        requirements:
          type: array
          items:
            type: string
        companyId:
          type: string
          format: uuid
        requirementId:
          type: string
          format: uuid
        location:
          type: string
        jobType:
          type: string
          enum: [full-time, part-time, contract, internship]
        salaryRange:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            currency:
              type: string
              default: "USD"
        benefits:
          type: array
          items:
            type: string
        applicationDeadline:
          type: string
          format: date
        isRemote:
          type: boolean
          default: false

    JobPosting:
      allOf:
        - $ref: '#/components/schemas/JobPostingInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [draft, pending_approval, active, closed]
            publishedAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            applicationCount:
              type: integer
              default: 0

    Candidate:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
        linkedinUrl:
          type: string
          format: uri
        portfolioUrl:
          type: string
          format: uri
        currentLocation:
          type: string
        willingToRelocate:
          type: boolean
        skills:
          type: array
          items:
            type: string
        experience:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperience'
        education:
          type: array
          items:
            $ref: '#/components/schemas/Education'
        expectedSalary:
          type: number
        noticePeriod:
          type: string
        resumeUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkExperience:
      type: object
      required:
        - company
        - position
        - startDate
      properties:
        company:
          type: string
        position:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        current:
          type: boolean
          default: false
        description:
          type: string
        skills:
          type: array
          items:
            type: string

    Education:
      type: object
      required:
        - institution
        - degree
        - fieldOfStudy
      properties:
        institution:
          type: string
        degree:
          type: string
        fieldOfStudy:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        grade:
          type: string

    Application:
      type: object
      required:
        - id
        - candidateId
        - jobId
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, screening, shortlisted, rejected, selected]
        coverLetter:
          type: string
        appliedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Resume:
      type: object
      required:
        - id
        - candidateId
        - fileUrl
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        fileUrl:
          type: string
          format: uri
        fileName:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        extractedText:
          type: string
        parsedData:
          type: object
        uploadedAt:
          type: string
          format: date-time

    ScreeningResult:
      type: object
      required:
        - candidateId
        - jobId
      properties:
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        overallScore:
          type: number
          minimum: 0
          maximum: 100
        skillMatchScore:
          type: number
          minimum: 0
          maximum: 100
        experienceMatchScore:
          type: number
          minimum: 0
          maximum: 100
        educationMatchScore:
          type: number
          minimum: 0
          maximum: 100
        keywordMatches:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        aiAnalysis:
          type: string
        screenedAt:
          type: string
          format: date-time

    AptitudeTest:
      type: object
      required:
        - id
        - jobId
        - title
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        duration:
          type: integer
          description: Duration in minutes
        questionCount:
          type: integer
        categories:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/TestQuestion'
        status:
          type: string
          enum: [draft, active, inactive]
        createdAt:
          type: string
          format: date-time

    TestQuestion:
      type: object
      required:
        - id
        - question
        - type
        - options
        - correctAnswer
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, coding, essay]
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string
        category:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        points:
          type: integer
          default: 1

    TestSubmission:
      type: object
      required:
        - testId
        - candidateId
        - answers
      properties:
        testId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
                format: uuid
              answer:
                type: string
              timeTaken:
                type: integer
                description: Time taken in seconds
        startedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time

    Interview:
      type: object
      required:
        - id
        - candidateId
        - jobId
        - type
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        type:
          type: string
          enum: [technical, hr]
        scheduledDate:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        interviewType:
          type: string
        difficulty:
          type: string
          enum: [junior, mid, senior, expert]
        createdAt:
          type: string
          format: date-time

    InterviewSession:
      type: object
      required:
        - id
        - interviewId
      properties:
        id:
          type: string
          format: uuid
        interviewId:
          type: string
          format: uuid
        candidateToken:
          type: string
        status:
          type: string
          enum: [waiting, in_progress, completed, terminated]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        deviceInfo:
          type: object
        recordingUrl:
          type: string
          format: uri

    ProctoringSession:
      type: object
      required:
        - id
        - sessionId
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, completed, terminated]
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ProctoringViolation'
        recordingUrls:
          type: object
          properties:
            video:
              type: string
              format: uri
            audio:
              type: string
              format: uri
            screen:
              type: string
              format: uri
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time

    ProctoringViolation:
      type: object
      required:
        - type
        - timestamp
      properties:
        type:
          type: string
          enum: [multiple_faces, face_not_visible, tab_switch, window_blur, suspicious_movement, external_device, no_face_detected]
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string
        evidence:
          type: object

    InterviewEvaluation:
      type: object
      required:
        - interviewId
        - candidateId
      properties:
        interviewId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        overallScore:
          type: number
          minimum: 0
          maximum: 100
        technicalScore:
          type: number
          minimum: 0
          maximum: 100
        communicationScore:
          type: number
          minimum: 0
          maximum: 100
        problemSolvingScore:
          type: number
          minimum: 0
          maximum: 100
        categoryScores:
          type: object
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        recommendations:
          type: string
        aiFeedback:
          type: string
        evaluatedAt:
          type: string
          format: date-time

    CandidateReport:
      type: object
      required:
        - id
        - candidateId
        - jobId
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        resumeScore:
          type: number
        testScore:
          type: number
        technicalInterviewScore:
          type: number
        hrInterviewScore:
          type: number
        overallRecommendation:
          type: string
          enum: [strong_reject, reject, hold, consider, strong_consider, hire]
        summary:
          type: string
        detailedFeedback:
          type: string
        generatedAt:
          type: string
          format: date-time

    OfferLetter:
      type: object
      required:
        - id
        - candidateId
        - jobId
        - salary
        - joiningDate
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        salary:
          type: number
        joiningDate:
          type: string
          format: date
        benefits:
          type: array
          items:
            type: string
        workLocation:
          type: string
        probationPeriod:
          type: integer
          description: Probation period in months
        terms:
          type: string
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, sent, accepted, declined, expired]

    Notification:
      type: object
      required:
        - id
        - recipientId
        - type
        - message
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        type:
          type: string
          enum: [email, in_app, sms]
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
          default: false
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
