openapi: 3.0.3
info:
  title: AI-Powered Recruitment Platform API
  description: |
    Comprehensive API for an intelligent recruitment platform that automates the end-to-end hiring process.
    Features include AI-powered resume screening, custom aptitude tests, AI avatar interviews with proctoring,
    and complete hiring workflow management with CRM integration.
    
    ## Key Features
    - Company onboarding and job requirement management
    - AI-powered resume screening via Gemini API
    - Custom aptitude test generation and evaluation
    - AI avatar interviews (Technical & HR)
    - Real-time proctoring and monitoring
    - Automated offer management
    - Talent pool management
    - Analytics and reporting
    
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@recruitmentplatform.com
  license:
    name: Proprietary
    
servers:
  - url: https://api.recruitmentplatform.com/v1
    description: Production server
  - url: https://staging-api.recruitmentplatform.com/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Development server

tags:
  - name: Company Management
    description: Company registration and profile management
  - name: Job Posting
    description: Job creation, approval, and publishing
  - name: Candidate Application
    description: Candidate application and profile management
  - name: AI Resume Screening
    description: AI-powered resume analysis and matching
  - name: Aptitude Test
    description: Custom test generation and evaluation
  - name: Technical Interview
    description: AI avatar technical interviews
  - name: Proctoring
    description: Interview and test monitoring
  - name: HR Interview
    description: AI avatar HR interviews
  - name: Final Selection
    description: Candidate report generation and selection
  - name: Offer Management
    description: Offer letter generation and tracking
  - name: Notifications
    description: Email and notification management

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ==================== COMPANY MANAGEMENT ====================
  /api/companies/register:
    post:
      tags:
        - Company Management
      summary: Register new company
      description: Register a new company on the platform with basic information
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyName
                - email
                - password
                - industry
                - size
              properties:
                companyName:
                  type: string
                  minLength: 2
                  maxLength: 200
                  example: "TechCorp Solutions"
                email:
                  type: string
                  format: email
                  example: "hr@techcorp.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "SecurePass123!"
                industry:
                  type: string
                  example: "Technology"
                size:
                  type: string
                  enum: [1-10, 11-50, 51-200, 201-500, 501-1000, 1001+]
                  example: "51-200"
                website:
                  type: string
                  format: uri
                  example: "https://techcorp.com"
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    country:
                      type: string
                    zipCode:
                      type: string
                phone:
                  type: string
                  example: "+1-555-0123"
      responses:
        '201':
          description: Company registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          score:
                            type: number
                          percentile:
                            type: number
                          categoryScores:
                            type: object
                          passed:
                            type: boolean

  /api/tests/{testId}/results:
    get:
      tags:
        - Aptitude Test
      summary: Get test results
      description: Retrieve test results and evaluation
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          score:
                            type: number
                          totalQuestions:
                            type: integer
                          correctAnswers:
                            type: integer
                          timeTaken:
                            type: integer
                          evaluation:
                            type: object

  # ==================== TECHNICAL INTERVIEW ====================
  /api/interviews/technical/schedule:
    post:
      tags:
        - Technical Interview
      summary: Schedule technical interview
      description: Schedule AI avatar technical interview for candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
                - jobId
                - scheduledDate
              properties:
                candidateId:
                  type: string
                  format: uuid
                jobId:
                  type: string
                  format: uuid
                scheduledDate:
                  type: string
                  format: date-time
                duration:
                  type: integer
                  example: 60
                interviewType:
                  type: string
                  enum: [coding, system_design, problem_solving, mixed]
                difficulty:
                  type: string
                  enum: [junior, mid, senior, expert]
      responses:
        '201':
          description: Interview scheduled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Interview'

  /api/interviews/technical/{candidateId}/send-invitation:
    post:
      tags:
        - Technical Interview
      summary: Send interview invitation
      description: Send technical interview invitation to candidate
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interviewId
              properties:
                interviewId:
                  type: string
                  format: uuid
                customMessage:
                  type: string
      responses:
        '200':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/interviews/technical/{interviewId}:
    get:
      tags:
        - Technical Interview
      summary: Get interview details
      description: Retrieve technical interview information
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interview details retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Interview'

  /api/interviews/technical/{interviewId}/start:
    post:
      tags:
        - Technical Interview
      summary: Start AI avatar interview
      description: Initialize AI avatar technical interview session
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateToken
              properties:
                candidateToken:
                  type: string
                deviceInfo:
                  type: object
      responses:
        '200':
          description: Interview started successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewSession'

  /api/interviews/technical/{interviewId}/proctoring:
    post:
      tags:
        - Technical Interview
      summary: Enable monitoring features
      description: Enable proctoring for technical interview
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enableCamera:
                  type: boolean
                  default: true
                enableEyeTracking:
                  type: boolean
                  default: true
                enableTabMonitoring:
                  type: boolean
                  default: true
                enableRecording:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Proctoring enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/interviews/technical/{interviewId}/submit:
    post:
      tags:
        - Technical Interview
      summary: Submit interview responses
      description: Submit technical interview answers
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - responses
              properties:
                responses:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId:
                        type: string
                      answer:
                        type: string
                      code:
                        type: string
                      timeTaken:
                        type: integer
      responses:
        '200':
          description: Responses submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/interviews/technical/{interviewId}/evaluate:
    post:
      tags:
        - Technical Interview
      summary: AI evaluates technical responses
      description: AI evaluates technical interview performance
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interview evaluated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewEvaluation'

  /api/interviews/technical/{interviewId}/results:
    get:
      tags:
        - Technical Interview
      summary: Get interview results
      description: Retrieve technical interview results
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewEvaluation'

  # ==================== PROCTORING ====================
  /api/proctoring/{sessionId}/start:
    post:
      tags:
        - Proctoring
      summary: Initialize proctoring session
      description: Start proctoring session for test or interview
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceInfo:
                  type: object
                browserInfo:
                  type: object
      responses:
        '200':
          description: Proctoring started successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProctoringSession'

  /api/proctoring/{sessionId}/camera:
    post:
      tags:
        - Proctoring
      summary: Enable camera monitoring
      description: Capture and analyze camera feed
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                frame:
                  type: string
                  format: binary
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Camera data processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  faceDetected:
                    type: boolean
                  multiplePersons:
                    type: boolean

  /api/proctoring/{sessionId}/eye-tracking:
    post:
      tags:
        - Proctoring
      summary: Track eye movement
      description: Monitor and log eye movement patterns
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gazePoints:
                  type: array
                  items:
                    type: object
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                      timestamp:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Eye tracking data logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/proctoring/{sessionId}/face-detection:
    post:
      tags:
        - Proctoring
      summary: Detect face presence
      description: Verify candidate face presence and identity
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageData:
                  type: string
                  format: byte
      responses:
        '200':
          description: Face detection completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  faceDetected:
                    type: boolean
                  confidence:
                    type: number
                  violations:
                    type: array
                    items:
                      type: string

  /api/proctoring/{sessionId}/tab-monitoring:
    post:
      tags:
        - Proctoring
      summary: Monitor tab switches
      description: Log tab switch and window focus events
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum: [tab_switch, window_blur, window_focus]
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Event logged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/proctoring/{sessionId}/violations:
    post:
      tags:
        - Proctoring
      summary: Log violations
      description: Record proctoring violations
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProctoringViolation'
      responses:
        '200':
          description: Violation logged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/proctoring/{sessionId}/report:
    get:
      tags:
        - Proctoring
      summary: Get proctoring report
      description: Retrieve complete proctoring session report
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Report retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionId:
                            type: string
                          violations:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProctoringViolation'
                          totalViolations:
                            type: integer
                          riskScore:
                            type: number
                          summary:
                            type: string

  /api/proctoring/{sessionId}/recording:
    post:
      tags:
        - Proctoring
      summary: Upload screen/audio recording
      description: Upload session recording files
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                videoFile:
                  type: string
                  format: binary
                audioFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: Recording uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== HR INTERVIEW ====================
  /api/interviews/hr/schedule:
    post:
      tags:
        - HR Interview
      summary: Schedule HR interview
      description: Schedule AI avatar HR interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
                - jobId
                - scheduledDate
              properties:
                candidateId:
                  type: string
                  format: uuid
                jobId:
                  type: string
                  format: uuid
                scheduledDate:
                  type: string
                  format: date-time
                duration:
                  type: integer
                  example: 45
      responses:
        '201':
          description: HR interview scheduled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Interview'

  /api/interviews/hr/{candidateId}/send-invitation:
    post:
      tags:
        - HR Interview
      summary: Send HR interview invitation
      description: Send HR interview invitation email
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interviewId
              properties:
                interviewId:
                  type: string
                  format: uuid
                customMessage:
                  type: string
      responses:
        '200':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/interviews/hr/{interviewId}:
    get:
      tags:
        - HR Interview
      summary: Get HR interview details
      description: Retrieve HR interview information
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interview details retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Interview'

  /api/interviews/hr/{interviewId}/start:
    post:
      tags:
        - HR Interview
      summary: Start AI avatar HR interview
      description: Initialize HR interview session
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateToken
              properties:
                candidateToken:
                  type: string
      responses:
        '200':
          description: Interview started successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewSession'

  /api/interviews/hr/{interviewId}/communication-assessment:
    post:
      tags:
        - HR Interview
      summary: Assess communication skills
      description: AI assesses candidate communication skills
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                videoData:
                  type: string
                  format: byte
                audioData:
                  type: string
                  format: byte
                transcript:
                  type: string
      responses:
        '200':
          description: Assessment completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  clarity:
                    type: number
                  confidence:
                    type: number
                  articulation:
                    type: number
                  bodyLanguage:
                    type: number

  /api/interviews/hr/{interviewId}/salary-negotiation:
    post:
      tags:
        - HR Interview
      summary: Handle salary negotiation
      description: Process salary expectation discussion
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedSalary:
                  type: number
                currentSalary:
                  type: number
                negotiable:
                  type: boolean
                notes:
                  type: string
      responses:
        '200':
          description: Salary information recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/interviews/hr/{interviewId}/evaluate:
    post:
      tags:
        - HR Interview
      summary: AI evaluates HR round
      description: AI evaluates HR interview performance
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evaluation completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewEvaluation'

  /api/interviews/hr/{interviewId}/results:
    get:
      tags:
        - HR Interview
      summary: Get HR interview results
      description: Retrieve HR interview evaluation results
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewEvaluation'

  # ==================== FINAL SELECTION ====================
  /api/reports/generate:
    post:
      tags:
        - Final Selection
      summary: Compile complete interview report
      description: Generate comprehensive candidate evaluation report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
                - jobId
              properties:
                candidateId:
                  type: string
                  format: uuid
                jobId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Report generated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CandidateReport'

  /api/reports/{candidateId}/send-to-company:
    post:
      tags:
        - Final Selection
      summary: Send report for review
      description: Send candidate report to company for review
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reportId
              properties:
                reportId:
                  type: string
                  format: uuid
                message:
                  type: string
      responses:
        '200':
          description: Report sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/reports/{candidateId}:
    get:
      tags:
        - Final Selection
      summary: Get candidate report
      description: Retrieve comprehensive candidate report
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CandidateReport'

  /api/selection/{candidateId}/approve:
    post:
      tags:
        - Final Selection
      summary: Company approves candidate
      description: Company approves candidate for final selection
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobId
              properties:
                jobId:
                  type: string
                  format: uuid
                feedback:
                  type: string
                offeredSalary:
                  type: number
                joiningDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Candidate approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/selection/{candidateId}/reject:
    post:
      tags:
        - Final Selection
      summary: Company rejects candidate
      description: Company rejects candidate after final review
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobId
                - reason
              properties:
                jobId:
                  type: string
                  format: uuid
                reason:
                  type: string
                feedback:
                  type: string
      responses:
        '200':
          description: Candidate rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== OFFER MANAGEMENT ====================
  /api/offers/generate:
    post:
      tags:
        - Offer Management
      summary: Generate offer letter
      description: Generate offer letter for selected candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candidateId
                - jobId
                - salary
                - joiningDate
              properties:
                candidateId:
