  # ==================== HR INTERVIEW ====================
  /hr-interview/start/{candidate_id}:
    post:
      tags:
        - HR Interview Management
      summary: Start HR interview
      description: |
        Start an AI-powered HR interview for a candidate.
        
        **Prerequisites:**
        - Candidate must have passed the technical interview
        - Candidate credentials must be valid
        
        **Interview Duration:** 5-12 minutes
      operationId: startHRInterview
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HRInterviewLoginRequest'
            example:
              job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
              email: "john.doe@email.com"
              password: "Abc12345"
      responses:
        '200':
          description: HR interview started
          content:
            application/json:
              example:
                success: true
