openapi: 3.0.3
info:
  title: HR Automation API
  description: |
    Complete HR Automation Platform API for managing the entire recruitment lifecycle including:
    - Company Management
    - Job Requirements
    - Candidate Applications & Resume Analysis
    - Aptitude Testing
    - Technical Interviews (AI-powered)
    - HR Interviews (AI-powered)
    
    **Authentication:** All endpoints require `workspace-id` and `user-id` headers.
  version: 1.0.0
  contact:
    name: HR Automation Team
    email: support@hrautomation.com

servers:
  - url: http://localhost:8888/interview-management-service/api/v1
    description: Main API Server
  - url: http://localhost:8100
    description: Technical Interview Service
  - url: http://localhost:8200
    description: HR Interview Service
  - url: http://localhost:8889
    description: Dynamic Form Service
  - url: http://localhost:8890
    description: Aptitude Test Service

tags:
  - name: Health
    description: Health check endpoints
  - name: Company Management
    description: Company registration and management
  - name: Job Requirements
    description: Job posting and requirements management
  - name: Candidate Management
    description: Candidate applications and resume management
  - name: Aptitude Management
    description: Aptitude test creation and management
  - name: Technical Interview Management
    description: AI-powered technical interviews
  - name: HR Interview Management
    description: AI-powered HR interviews

paths:
  # ==================== HEALTH ====================
  /health/:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: "ok"
                message: "Workspace Management Service healthy"

  # ==================== COMPANY MANAGEMENT ====================
  /companies/register/:
    post:
      tags:
        - Company Management
      summary: Register a new company
      description: Register a new company on the HR Automation platform
      operationId: createCompany
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
            example:
              company_name: "TechCorp Solutions"
              email: "hr@techcorp.com"
              password: "SecurePass123!"
              industry: "Technology"
              size: "51-200"
              website: "https://techcorp.com"
              address:
                street: "123 Business St"
                city: "New York"
                state: "NY"
                country: "USA"
                zip_code: "10001"
              phone: "+1-555-0123"
              logo: "https://techcorp.com/logo.png"
              subscription_plan: "professional"
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data:
                  company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                  company_name: "TechCorp Solutions"
                  email: "hr@techcorp.com"
                  industry: "Technology"
                  size: "51-200"
                  website: "https://techcorp.com"
                  address:
                    street: "123 Business St"
                    city: "New York"
                    state: "NY"
                    country: "USA"
                    zip_code: "10001"
                  phone: "+1-555-0123"
                  logo: "https://techcorp.com/logo.png"
                  subscription_plan: "professional"
                  is_active: true
                  created_at: "2024-01-15T10:30:00Z"
                  updated_at: "2024-01-15T10:30:00Z"
                message: "Company registered successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Company already exists
          content:
            application/json:
              example:
                success: false
                error_message: "Company with this email already exists"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /companies/{company_id}/:
    get:
      tags:
        - Company Management
      summary: Get company by ID
      description: Retrieve company details by company ID
      operationId: getCompany
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Company retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data:
                  company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                  company_name: "TechCorp Solutions"
                  email: "hr@techcorp.com"
                  industry: "Technology"
                  size: "51-200"
                  is_active: true
                message: "Company retrieved successfully"
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Company Management
      summary: Delete company
      description: Soft delete a company from the platform
      operationId: deleteCompany
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Company deleted successfully
          content:
            application/json:
              example:
                success: true
                data: {}
                message: "Company deleted successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Company Management
      summary: Update company
      description: Update company details
      operationId: updateCompany
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
            example:
              company_name: "Updated TechCorp"
              industry: "Software Development"
              size: "201-500"
              website: "https://updated-techcorp.com"
              phone: "+1-555-0124"
              subscription_plan: "enterprise"
      responses:
        '200':
          description: Company updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data:
                  company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                  company_name: "Updated TechCorp"
                  email: "hr@techcorp.com"
                  industry: "Software Development"
                  size: "201-500"
                  website: "https://updated-techcorp.com"
                  phone: "+1-555-0124"
                  subscription_plan: "enterprise"
                  is_active: true
                  created_at: "2024-01-15T10:30:00Z"
                  updated_at: "2024-01-16T14:30:00Z"
                message: "Company updated successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /companies/:
    get:
      tags:
        - Company Management
      summary: List all companies
      description: Retrieve a paginated list of all companies
      operationId: listCompanies
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Companies retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              example:
                success: true
                data:
                  - company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                    company_name: "TechCorp Solutions"
                    email: "hr@techcorp.com"
                    industry: "Technology"
                    size: "51-200"
                    is_active: true
                    created_at: "2024-01-15T10:30:00Z"
                  - company_id: "b4d9f7c2-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                    company_name: "InnovateTech Inc"
                    email: "careers@innovatetech.com"
                    industry: "Software"
                    size: "201-500"
                    is_active: true
                    created_at: "2024-01-10T08:00:00Z"
                pagination:
                  total_count: 25
                  offset: 0
                  limit: 20
                  total_pages: 2
                message: "Companies retrieved successfully"

  # ==================== JOB REQUIREMENTS ====================
  /companies/{company_id}/job-requirements/:
    post:
      tags:
        - Job Requirements
      summary: Create job requirement
      description: Create a new job requirement for a company. Also posts to LinkedIn automatically.
      operationId: createJobRequirement
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequirementCreateRequest'
            example:
              title: "Senior Python Developer"
              department: "Engineering"
              description: "We are looking for a Senior Python Developer to join our team. You will be responsible for designing, developing, and maintaining high-quality Python applications."
              requirements:
                - skill: "Python"
                  level: "advanced"
                  required: true
                - skill: "FastAPI"
                  level: "intermediate"
                  required: true
                - skill: "PostgreSQL"
                  level: "intermediate"
                  required: false
                - skill: "Docker"
                  level: "beginner"
                  required: false
              experience:
                min_years: 3
                max_years: 7
                preferred: 5
              location: "New York, NY"
              job_type: "full-time"
              salary_range:
                min: 80000
                max: 120000
                currency: "USD"
              benefits:
                - "Health Insurance"
                - "401k"
                - "Remote Work Options"
                - "Flexible Hours"
      responses:
        '201':
          description: Job requirement created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data:
                  job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                  company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                  title: "Senior Python Developer"
                  department: "Engineering"
                  description: "We are looking for a Senior Python Developer..."
                  requirements:
                    - skill: "Python"
                      level: "advanced"
                      required: true
                    - skill: "FastAPI"
                      level: "intermediate"
                      required: true
                  experience:
                    min_years: 3
                    max_years: 7
                    preferred: 5
                  location: "New York, NY"
                  job_type: "full-time"
                  salary_range:
                    min: 80000
                    max: 120000
                    currency: "USD"
                  benefits:
                    - "Health Insurance"
                    - "401k"
                    - "Remote Work Options"
                  status: "draft"
                  is_active: true
                  created_at: "2024-01-15T10:30:00Z"
                  updated_at: "2024-01-15T10:30:00Z"
                message: "Job requirement created successfully. LinkedIn posting initiated."

    get:
      tags:
        - Job Requirements
      summary: List job requirements by company
      description: List all job requirements for a specific company
      operationId: listJobRequirementsByCompany
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, closed]
          description: Filter by job status
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Job requirements retrieved
          content:
            application/json:
              example:
                success: true
                data:
                  - job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                    company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                    title: "Senior Python Developer"
                    department: "Engineering"
                    status: "active"
                    location: "New York, NY"
                    job_type: "full-time"
                pagination:
                  total_count: 5
                  offset: 0
                  limit: 20
                  total_pages: 1
                message: "Job requirements retrieved successfully"

  /job-requirements/{job_requirement_id}/:
    get:
      tags:
        - Job Requirements
      summary: Get job requirement by ID
      description: Retrieve job requirement details
      operationId: getJobRequirement
      parameters:
        - $ref: '#/components/parameters/JobRequirementId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Job requirement retrieved
          content:
            application/json:
              example:
                success: true
                data:
                  job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                  company_id: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"
                  title: "Senior Python Developer"
                  department: "Engineering"
                  description: "We are looking for a Senior Python Developer..."
                  requirements:
                    - skill: "Python"
                      level: "advanced"
                      required: true
                  experience:
                    min_years: 3
                    max_years: 7
                    preferred: 5
                  location: "New York, NY"
                  job_type: "full-time"
                  salary_range:
                    min: 80000
                    max: 120000
                    currency: "USD"
                  benefits:
                    - "Health Insurance"
                    - "401k"
                  status: "active"
                  is_active: true
                  created_at: "2024-01-15T10:30:00Z"
                  updated_at: "2024-01-15T10:30:00Z"
                message: "Job requirement retrieved successfully"

    put:
      tags:
        - Job Requirements
      summary: Update job requirement
      description: Update an existing job requirement
      operationId: updateJobRequirement
      parameters:
        - $ref: '#/components/parameters/JobRequirementId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequirementUpdateRequest'
            example:
              title: "Lead Python Developer"
              description: "Updated job description for lead position..."
              experience:
                min_years: 5
                max_years: 10
                preferred: 7
              salary_range:
                min: 100000
                max: 150000
                currency: "USD"
              status: "active"
      responses:
        '200':
          description: Job requirement updated
          content:
            application/json:
              example:
                success: true
                data:
                  job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                  title: "Lead Python Developer"
                  status: "active"
                  updated_at: "2024-01-16T14:30:00Z"
                message: "Job requirement updated successfully"

    delete:
      tags:
        - Job Requirements
      summary: Delete job requirement
      description: Soft delete a job requirement
      operationId: deleteJobRequirement
      parameters:
        - $ref: '#/components/parameters/JobRequirementId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Job requirement deleted
          content:
            application/json:
              example:
                success: true
                data: {}
                message: "Job requirement deleted successfully"

  /job-requirements/{job_requirement_id}/status/:
    patch:
      tags:
        - Job Requirements
      summary: Update job requirement status
      description: Update only the status of a job requirement
      operationId: updateJobRequirementStatus
      parameters:
        - $ref: '#/components/parameters/JobRequirementId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, active, closed]
            example:
              status: "active"
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              example:
                success: true
                data:
                  job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                  status: "active"
                message: "Job requirement status updated successfully"

  /job-requirements/:
    get:
      tags:
        - Job Requirements
      summary: List all job requirements
      description: Retrieve all job requirements across companies
      operationId: listJobRequirements
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, closed]
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Job requirements list
          content:
            application/json:
              example:
                success: true
                data:
                  - job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                    title: "Senior Python Developer"
                    department: "Engineering"
                    status: "active"
                  - job_requirement_id: "c5d0f8c2-5e3d-6g8h-0c4f-1e0g9h8d7f6g"
                    title: "Frontend React Developer"
                    department: "Engineering"
                    status: "active"
                pagination:
                  total_count: 15
                  offset: 0
                  limit: 20
                  total_pages: 1
                message: "Job requirements retrieved successfully"

  # ==================== CANDIDATE MANAGEMENT ====================
  /candidates/apply/{job_requirement_id}:
    get:
      tags:
        - Candidate Management
      summary: Get application form
      description: Get job details and generate application form URL for a job requirement
      operationId: getApplicationForm
      parameters:
        - $ref: '#/components/parameters/JobRequirementId'
      responses:
        '200':
          description: Application form generated
          content:
            application/json:
              example:
                success: true
                data:
                  job_details:
                    job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                    title: "Senior Python Developer"
                    department: "Engineering"
                    description: "We are looking for a Senior Python Developer..."
                    requirements:
                      - skill: "Python"
                        level: "advanced"
                        required: true
                    location: "New York, NY"
                    job_type: "full-time"
                    salary_range:
                      min: 80000
                      max: 120000
                      currency: "USD"
                  form_url: "http://localhost:8889/forms/b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f.html"
                  form_path: "/forms/b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f.html"
                message: "Job details retrieved and form generated successfully"

  /candidates/apply:
    post:
      tags:
        - Candidate Management
      summary: Submit job application
      description: Submit a job application with resume upload. The resume is analyzed by AI for scoring.
      operationId: submitApplication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateApplicationRequest'
            example:
              job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
              first_name: "John"
              last_name: "Doe"
              email: "john.doe@email.com"
              phone: "+1-555-0199"
              linkedin_url: "https://linkedin.com/in/johndoe"
              portfolio_url: "https://github.com/johndoe"
              current_location: "San Francisco, CA"
              willing_to_relocate: "true"
              skills: "Python, FastAPI, PostgreSQL, Docker, AWS"
              expected_salary: "95000"
              notice_period: "2 weeks"
              resume: "(binary file)"
      responses:
        '200':
          description: Application submitted successfully
          content:
            application/json:
              example:
                success: true
                data:
                  candidate_id: "d6e1g9d3-6f4e-7h9i-1d5g-2f1h0i9e8g7h"
                  job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                  first_name: "John"
                  last_name: "Doe"
                  email: "john.doe@email.com"
                  password: "Abc12345"
                  phone: "+1-555-0199"
                  linkedin_url: "https://linkedin.com/in/johndoe"
                  portfolio_url: "https://github.com/johndoe"
                  current_location: "San Francisco, CA"
                  willing_to_relocate: true
                  skills:
                    - "Python"
                    - "FastAPI"
                    - "PostgreSQL"
                    - "Docker"
                    - "AWS"
                  expected_salary: 95000.0
                  notice_period: "2 weeks"
                  resume_url: "/resumes/d6e1g9d3-6f4e-7h9i-1d5g-2f1h0i9e8g7h/resume.pdf"
                  candidate_resume_score: 85.5
                  status: "active"
                  aptitude_test: null
                  technical_test: null
                  hr_test: null
                  aptitude_test_result: null
                  technical_test_result: null
                  hr_test_result: null
                  resume_selected: null
                message: "Application submitted successfully"
        '409':
          description: Duplicate application
          content:
            application/json:
              example:
                success: false
                error_message: "You have already applied to this job position."

  /candidates/{candidate_id}:
    get:
      tags:
        - Candidate Management
      summary: Get candidate by ID
      description: Retrieve candidate details by candidate ID
      operationId: getCandidate
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200':
          description: Candidate retrieved
          content:
            application/json:
              example:
                success: true
                data:
                  candidate_id: "d6e1g9d3-6f4e-7h9i-1d5g-2f1h0i9e8g7h"
                  job_requirement_id: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
                  first_name: "John"
                  last_name: "Doe"
                  email: "john.doe@email.com"
                  password: "Abc12345"
                  phone: "+1-555-0199"
                  skills:
                    - "Python"
                    - "FastAPI"
                  resume_url: "/resumes/d6e1g9d3-6f4e-7h9i-1d5g-2f1h0i9e8g7h/resume.pdf"
                  candidate_resume_score: 85.5
                  status: "active"
                  aptitude_test: true
                  technical_test: true
                  hr_test: false
                  aptitude_test_result: "pass"
                  technical_test_result: "pass"
                  hr_test_result: null
                  resume_selected: true
                message: "Candidate retrieved successfully"

  /candidates/:
    get:
      tags:
        - Candidate Management
      summary: List candidates
      description: List candidates filtered by job requirement with pagination
      operationId: listCandidates
      parameters:
        - name: job_requirement_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Candidates list
          content:
            application/json:
              example:
                success: true
                data:
                  success: true
                  data:
                    - candidate_id: "d6e1g9d3-6f4e-7h9i-1d5g-2f1h0i9e8g7h"
                      first_name: "John"
                      last_name: "Doe"
