components:
  parameters:
    WorkspaceId:
      name: workspace-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Workspace ID
      example: "12345678-1234-1234-1234-123456789012"

    UserId:
      name: user-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: User ID
      example: "87654321-4321-4321-4321-210987654321"

    CompanyId:
      name: company_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Company ID
      example: "a3d8f6b0-3c1b-4e6f-8a2d-9c8e7f6a5b4d"

    JobRequirementId:
      name: job_requirement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Job Requirement ID
      example: "b4c9f7c1-4d2c-5f7g-9b3e-0d9f8g7c6e5f"

    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Candidate ID
      example: "d6e1g9d3-6f4e-7h9i-1d5g-2f1h0i9e8g7h"

    AptitudeTestId:
      name: aptitude_test_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Aptitude Test ID
      example: "c5d0f8c2-5e3d-6g8h-0c4f-1e0g9h8d7f6g"

    TechnicalInterviewId:
      name: technical_interview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Technical Interview ID
      example: "h0i5k3h7-0j8i-1l3m-5h9k-6j5l4m3i2k1l"

    HRInterviewId:
      name: hr_interview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: HR Interview ID
      example: "i1j6l4i8-1k9j-2m4n-6i0l-7k6m5n4j3l2m"

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of records to skip
      example: 0

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items to return
      example: 20

    OrderBy:
      name: order_by
      in: query
      schema:
        type: string
        default: "-created_at"
      description: Field to order by (prefix with '-' for descending)
      example: "-created_at"

    Search:
      name: search
      in: query
      schema:
        type: string
      description: Search query string
      example: "Python Developer"

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: "ok"
        message:
          type: string
          example: "Workspace Management Service healthy"

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        data:
          type: object
          description: Response data
        message:
          type: string
          description: Response message

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        message:
          type: string

    PaginationMeta:
      type: object
      properties:
        total_count:
          type: integer
          description: Total number of records
          example: 25
        offset:
          type: integer
          description: Number of records skipped
          example: 0
        limit:
          type: integer
          description: Maximum records per page
          example: 20
        total_pages:
          type: integer
          description: Total number of pages
          example: 2

    AddressSchema:
      type: object
      properties:
        street:
          type: string
          example: "123 Business St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        country:
          type: string
          example: "USA"
        zip_code:
          type: string
          example: "10001"

    CompanyCreateRequest:
      type: object
      required:
        - company_name
        - email
        - password
        - industry
        - size
      properties:
        company_name:
          type: string
          minLength: 2
          maxLength: 200
          description: Company name
        email:
          type: string
          format: email
          description: Company email address
