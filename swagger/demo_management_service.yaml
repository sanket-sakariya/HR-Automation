openapi: 3.0.0
info:
  title: Demo Management Service API
  version: 2.0.1
  description: API for managing DemoA, DemoB, and their mappings, including creation, updates, and lifecycle operations

servers:
  - url: https://159.203.10.100:8501

paths:

  # DemoA endpoints
  /demo-as/:
    get:
      tags:
        - DemoA
      summary: Get all demo As
      operationId: listDemoAs
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OrderByParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/FiltersParam'
        - in: query
          name: status
          schema:
            type: string
            enum: ['created', 'updating', 'updated', 'deleting', 'deleted']
          required: false
          description: Filter demo As by status
          example: "created"
      responses:
        '200':
          description: List of demo As retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemoAModel'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

