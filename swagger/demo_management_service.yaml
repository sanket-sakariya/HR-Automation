components:
  
  parameters:
    UserIdHeader:
      name: user-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the authenticated user
      example: "c8d88692-4060-4e8a-ba30-c6da3b7e5f1a"
    
    WorkspaceIdHeader:
      name: workspace-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the workspace
      example: "bd086124-1a9d-4a6e-8431-1c7f8e9d2a3b"

    OffsetParam:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: Number of records to skip
      example: 0

    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      required: false
      description: Number of items to return
      example: 100

    OrderByParam:
      in: query
      name: order_by
      schema:
        type: string
        default: "-created_at"
      required: false
      description: Field to order by. Prefix with '-' for descending order
      example: "-created_at"

    SearchParam:
      in: query
      name: search
      schema:
        type: string
      required: false
      description: Search query string to filter results
      example: "Sample"

    FiltersParam:
      in: query
      name: filters
      schema:
        type: array
        items:
          type: string
      required: false
      description: List of filter dicts as JSON strings
      example: '["{\"field\": \"status\", \"operator\": \"eq\", \"value\": \"created\"}", "{\"field\": \"is_active\", \"operator\": \"eq\", \"value\": true}"]'
  
  schemas:
    
    BaseAppModel:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          nullable: false
          description: Timestamp when record was created
          example: "2024-01-15T10:30:00Z"
